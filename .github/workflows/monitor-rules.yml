name: 规则源监控 (预警系统)

on:
  # 每天北京时间 08:10 自动运行（UTC 00:10）
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ALERT_ISSUE_TITLE: '⚠️ 规则源故障预警：当前已触发降级方案'

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: 设置 Python 环境
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
          cache: pip

      - name: 安装依赖
        run: python -m pip install --requirement requirements.txt

      - name: 检查外部规则可用性
        id: check_rules
        shell: bash
        run: |
          set -uo pipefail

          message=$(python update_rules.py --validate-monitored-sources 2>&1)
          status=$?
          printf '%s\n' "$message"

          if [ "$status" -ne 0 ]; then
            {
              echo 'message<<MONITOR_VALIDATION_EOF'
              printf '%s\n' "$message"
              echo 'MONITOR_VALIDATION_EOF'
            } >> "$GITHUB_OUTPUT"
            exit "$status"
          fi

      - name: 创建或更新 GitHub Issue 提醒
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MONITOR_MESSAGE: ${{ steps.check_rules.outputs.message }}
        with:
          script: |
            const title = process.env.ALERT_ISSUE_TITLE;
            const now = new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
            const details = process.env.MONITOR_MESSAGE || '监控步骤异常退出，请查看本次 Actions 日志。';
            const body = [
              '监控到上游源异常，生成器将使用各来源的 last-known-good 缓存维持运行。',
              '',
              `更新时间：${now}`,
              '',
              '```text',
              details,
              '```',
              '',
              `Actions：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: 上游恢复后关闭现有预警
        if: success()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = process.env.ALERT_ISSUE_TITLE;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find(issue => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `全部受监控规则源已恢复。恢复时间：${new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })}`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }
